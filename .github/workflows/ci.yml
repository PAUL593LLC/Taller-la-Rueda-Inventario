name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Verificar que el código compila
        run: |
          if [ -d src ]; then python -m compileall src; fi
      - name: Confirmar que el pipeline se ejecutó
        run: echo "Pipeline ejecutado correctamente para el modulo de inventario."
